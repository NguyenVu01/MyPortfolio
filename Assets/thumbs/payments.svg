<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Payment switching system solution design">
  <defs>
    <linearGradient id="g3bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0a24"/><stop offset="1" stop-color="#06080f"/>
    </linearGradient>
    <radialGradient id="g3halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".5"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g3panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="g3acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4cc9ff"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#g3bg)"/>
  <g stroke="#211b46" stroke-width="1" opacity=".8">
    <path d="M0 90h800M0 180h800M0 270h800M0 360h800"/>
    <path d="M100 0v450M200 0v450M300 0v450M400 0v450M500 0v450M600 0v450M700 0v450"/>
  </g>
  <ellipse cx="400" cy="225" rx="320" ry="210" fill="url(#g3halo)"/>

  <!-- issuers -->
  <g font-family="system-ui,sans-serif" font-size="12" fill="#cbb9ff">
    <rect x="46" y="112" width="126" height="46" rx="12" fill="url(#g3panel)" stroke="#3a3170"/>
    <text x="109" y="140" text-anchor="middle">Issuer bank</text>
    <rect x="46" y="192" width="126" height="46" rx="12" fill="url(#g3panel)" stroke="#3a3170"/>
    <text x="109" y="220" text-anchor="middle">Wallet</text>
    <rect x="46" y="272" width="126" height="46" rx="12" fill="url(#g3panel)" stroke="#3a3170"/>
    <text x="109" y="300" text-anchor="middle">Merchant</text>
  </g>
  <g stroke="#7c5cff" stroke-width="2" fill="none" opacity=".85">
    <path d="M172 135h48q18 0 18 20v40"/>
    <path d="M172 215h66"/>
    <path d="M172 295h48q18 0 18-20v-40"/>
  </g>

  <!-- switch core -->
  <g>
    <rect x="238" y="150" width="196" height="130" rx="20" fill="#120c33" stroke="url(#g3acc)" stroke-width="2"/>
    <text x="336" y="192" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="700" font-size="18" fill="#f0eaff">Payment Switch</text>
    <text x="336" y="214" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#9d8bff">routing, clearing, settlement</text>
    <g font-family="monospace" font-size="11">
      <rect x="262" y="230" width="76" height="24" rx="12" fill="#4cc9ff" fill-opacity=".12"/>
      <text x="300" y="246" text-anchor="middle" fill="#7dd3fc">ISO 20022</text>
      <rect x="348" y="230" width="66" height="24" rx="12" fill="#a855f7" fill-opacity=".16"/>
      <text x="381" y="246" text-anchor="middle" fill="#d8b4fe">24/7</text>
    </g>
  </g>

  <!-- product rails -->
  <g stroke="#a855f7" stroke-width="2" fill="none" opacity=".8">
    <path d="M434 180h44q18 0 18-18v-32h44"/>
    <path d="M434 205h62q18 0 18 0h44"/>
    <path d="M434 240h44q18 0 18 18v14h44"/>
    <path d="M434 258h44q18 0 18 28v42h44"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="13" fill="#e9e3ff">
    <rect x="540" y="106" width="204" height="48" rx="12" fill="url(#g3panel)" stroke="#4b3f8f"/>
    <text x="566" y="130" font-weight="600">A2A</text>
    <text x="620" y="130" font-size="11" fill="#9d8bff">account to account</text>

    <rect x="540" y="181" width="204" height="48" rx="12" fill="url(#g3panel)" stroke="#4b3f8f"/>
    <text x="566" y="205" font-weight="600">BNPL</text>
    <text x="628" y="205" font-size="11" fill="#9d8bff">buy now pay later</text>

    <rect x="540" y="248" width="204" height="48" rx="12" fill="url(#g3panel)" stroke="#4b3f8f"/>
    <text x="566" y="272" font-weight="600">RTP</text>
    <text x="618" y="272" font-size="11" fill="#9d8bff">request to pay</text>

    <rect x="540" y="315" width="204" height="48" rx="12" fill="url(#g3panel)" stroke="#4b3f8f"/>
    <text x="566" y="339" font-weight="600">CoP</text>
    <text x="618" y="339" font-size="11" fill="#9d8bff">confirmation of payee</text>
  </g>

  <text x="46" y="392" font-family="system-ui,sans-serif" font-size="12" fill="#8b7ec9">BRD, process flows, core data model, RFP</text>
</svg>
