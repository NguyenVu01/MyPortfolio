    <text x="116" y="360" font-size="11" letter-spacing="1.25" fill="#b8c8ed">OFFLINE SOURCE CODE REVIEW</text>
    <text x="116" y="379" font-size="11" fill="#8296c3">300K LOC   Docker static analysis   Local AI models</text>
    <text x="608" y="365" font-size="23" font-weight="700" fill="#e7efff">34</text>
    <text x="645" y="364" font-size="10.5" fill="#8da1cf">IRL items</text>
    <text x="645" y="380" font-size="10.5" fill="#8da1cf">8 workshops</text>
