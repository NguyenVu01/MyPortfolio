    <path d="M100 0v450M200 0v450M300 0v450M400 0v450M500 0v450M600 0v450M700 0v450"/>
  </g>
  <ellipse cx="380" cy="205" rx="355" ry="230" fill="url(#cbGlow)"/>

  <text x="56" y="60" font-family="system-ui,sans-serif" font-size="12" letter-spacing="2.4" fill="#94b9f7">CORE BANKING ASSESSMENT</text>
  <text x="56" y="82" font-family="system-ui,sans-serif" font-size="12" fill="#7187b8">CASA migration readiness and IT &amp; data governance</text>

  <!-- dual core systems -->
  <g font-family="system-ui,sans-serif">
    <rect x="56" y="118" width="230" height="182" rx="18" fill="url(#cbPanel)" stroke="#3a4a7d"/>
    <circle cx="84" cy="147" r="7" fill="#fbbf24"/>
    <text x="101" y="151" font-size="12" letter-spacing="1.3" fill="#b8c8ed">VENDOR SAAS CORE</text>
    <g fill="none" stroke="#7e93c7" stroke-width="1.4" opacity=".65">
      <rect x="82" y="177" width="178" height="30" rx="7"/>
      <rect x="82" y="220" width="178" height="30" rx="7"/>
    </g>
    <text x="98" y="197" font-size="12" fill="#d2ddf5">CASA deposits</text>
    <text x="98" y="240" font-size="12" fill="#91a4cf">Current production</text>
    <circle cx="238" cy="192" r="5" fill="#fbbf24"/>
    <text x="82" y="279" font-size="10.5" fill="#778bb8">Vendor managed platform</text>

    <rect x="326" y="118" width="230" height="182" rx="18" fill="url(#cbPanel)" stroke="#4cc9ff" stroke-opacity=".65"/>
    <circle cx="354" cy="147" r="7" fill="#4cc9ff"/>
    <text x="371" y="151" font-size="12" letter-spacing="1.3" fill="#b8c8ed">IN HOUSE CORE</text>
    <g fill="none" stroke="#5ca8d3" stroke-width="1.4" opacity=".75">
      <rect x="352" y="177" width="178" height="30" rx="7"/>
      <rect x="352" y="220" width="178" height="30" rx="7"/>
    </g>
    <text x="368" y="197" font-size="12" fill="#d2ddf5">Cloud native services</text>
    <text x="368" y="240" font-size="12" fill="#91a4cf">CASA cutover target</text>
    <path d="M370 272h92" stroke="url(#cbGreen)" stroke-width="3" stroke-linecap="round"/>
    <text x="352" y="279" font-size="10.5" fill="#83d7da">Conditionally ready</text>
  </g>

  <!-- migration connector -->
  <g fill="none" stroke="url(#cbAcc)" stroke-width="2">
    <path d="M286 209h40"/>
    <path d="m314 200 12 9-12 9"/>
  </g>
  <text x="306" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#a9bdf0">CASA</text>

  <!-- assessment and governance column -->
  <g font-family="system-ui,sans-serif">
    <rect x="596" y="118" width="148" height="182" rx="18" fill="url(#cbPanel)" stroke="#a855f7" stroke-opacity=".6"/>
    <text x="616" y="150" font-size="11" letter-spacing="1.3" fill="#c9b8ff">11 DOMAINS</text>
    <g font-size="10.5" fill="#9eb1dc">
      <text x="616" y="180">IT governance</text>
      <text x="616" y="205">Data quality</text>
      <text x="616" y="230">Data lineage</text>
      <text x="616" y="255">Privacy controls</text>
    </g>
    <g fill="#a855f7">
      <circle cx="606" cy="176" r="3"/><circle cx="606" cy="201" r="3"/><circle cx="606" cy="226" r="3"/><circle cx="606" cy="251" r="3"/>
    </g>
    <rect x="616" y="268" width="104" height="6" rx="3" fill="#263354"/>
    <rect x="616" y="268" width="71" height="6" rx="3" fill="url(#cbAcc)"/>
  </g>

  <!-- secure source review footer -->
  <g font-family="system-ui,sans-serif">
    <rect x="56" y="335" width="688" height="58" rx="14" fill="#0e1730" stroke="#34466f"/>
    <g transform="translate(80 351)" fill="none" stroke="#4cc9ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M11 2 20 6v6c0 5.3-3.7 9.6-9 11-5.3-1.4-9-5.7-9-11V6z"/>
      <path d="m7.5 12 2.2 2.2 4.7-5"/>
