<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Core banking assessment and data governance advisory">
  <defs>
    <linearGradient id="cbBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1024"/><stop offset="1" stop-color="#05070f"/>
    </linearGradient>
    <linearGradient id="cbAcc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4cc9ff"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="cbGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#4cc9ff"/>
