    <linearGradient id="cbPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".11"/><stop offset="1" stop-color="#ffffff" stop-opacity=".025"/>
    </linearGradient>
    <radialGradient id="cbGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#6d5dfc" stop-opacity=".48"/><stop offset="1" stop-color="#6d5dfc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#cbBg)"/>
