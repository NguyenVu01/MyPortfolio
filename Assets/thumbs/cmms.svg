<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="Compliance monitoring and management dashboard">
  <defs>
    <linearGradient id="g2bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081226"/><stop offset="1" stop-color="#06080f"/>
    </linearGradient>
    <radialGradient id="g2halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".36"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="g2panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="g2bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".25"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#g2bg)"/>
  <g stroke="#132a45" stroke-width="1" opacity=".8">
    <path d="M0 90h800M0 180h800M0 270h800M0 360h800"/>
    <path d="M100 0v450M200 0v450M300 0v450M400 0v450M500 0v450M600 0v450M700 0v450"/>
  </g>
  <ellipse cx="400" cy="200" rx="330" ry="200" fill="url(#g2halo)"/>

  <text x="56" y="60" font-family="system-ui,sans-serif" font-size="13" fill="#7fa8c4" letter-spacing="2">COMPLIANCE MONITORING</text>

  <!-- KPI tiles -->
  <g font-family="system-ui,sans-serif">
    <rect x="56" y="80" width="164" height="76" rx="14" fill="url(#g2panel)" stroke="#2a5570"/>
    <text x="78" y="110" font-size="11" fill="#7fa8c4" letter-spacing="1">OBLIGATIONS</text>
    <text x="78" y="138" font-size="22" font-weight="700" fill="#e6edff">248</text>

    <rect x="236" y="80" width="164" height="76" rx="14" fill="url(#g2panel)" stroke="#2a5570"/>
    <text x="258" y="110" font-size="11" fill="#7fa8c4" letter-spacing="1">COMPLIANT</text>
    <text x="258" y="138" font-size="22" font-weight="700" fill="#6ee7b7">92%</text>

    <rect x="416" y="80" width="164" height="76" rx="14" fill="url(#g2panel)" stroke="#2a5570"/>
    <text x="438" y="110" font-size="11" fill="#7fa8c4" letter-spacing="1">OVERDUE</text>
    <text x="438" y="138" font-size="22" font-weight="700" fill="#fbbf24">11</text>

    <rect x="596" y="80" width="148" height="76" rx="14" fill="url(#g2panel)" stroke="#2a5570"/>
    <text x="618" y="110" font-size="11" fill="#7fa8c4" letter-spacing="1">UNITS</text>
    <text x="618" y="138" font-size="22" font-weight="700" fill="#7dd3fc">36</text>
  </g>

  <!-- trend panel -->
  <g>
    <rect x="56" y="176" width="344" height="216" rx="16" fill="url(#g2panel)" stroke="#2a5570"/>
    <text x="80" y="208" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#cfe9ff">Compliance by quarter</text>
    <g stroke="#1b3a52"><path d="M80 350h296M80 306h296M80 262h296"/></g>
    <g fill="url(#g2bar)">
      <rect x="100" y="286" width="38" height="64" rx="6"/>
      <rect x="158" y="262" width="38" height="88" rx="6"/>
      <rect x="216" y="240" width="38" height="110" rx="6"/>
      <rect x="274" y="228" width="38" height="122" rx="6"/>
      <rect x="332" y="222" width="38" height="128" rx="6"/>
    </g>
    <g font-family="system-ui,sans-serif" font-size="10" fill="#63739c" text-anchor="middle">
      <text x="119" y="370">Q1</text><text x="177" y="370">Q2</text><text x="235" y="370">Q3</text>
      <text x="293" y="370">Q4</text><text x="351" y="370">Q1</text>
    </g>
  </g>

  <!-- obligation register -->
  <g>
    <rect x="416" y="176" width="328" height="216" rx="16" fill="url(#g2panel)" stroke="#2a5570"/>
    <text x="440" y="208" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#cfe9ff">Obligation register</text>
    <g font-family="system-ui,sans-serif" font-size="11.5" fill="#9fd6ff">
      <rect x="440" y="224" width="280" height="34" rx="8" fill="#0e2233"/>
      <circle cx="460" cy="241" r="6" fill="#34d399"/><text x="476" y="245">Circular 09, reporting</text>
      <text x="690" y="245" fill="#6ee7b7" text-anchor="end">OK</text>

      <rect x="440" y="266" width="280" height="34" rx="8" fill="#0e2233"/>
      <circle cx="460" cy="283" r="6" fill="#34d399"/><text x="476" y="287">AML transaction screening</text>
      <text x="690" y="287" fill="#6ee7b7" text-anchor="end">OK</text>

      <rect x="440" y="308" width="280" height="34" rx="8" fill="#221b0e"/>
      <circle cx="460" cy="325" r="6" fill="#fbbf24"/><text x="476" y="329">Data retention review</text>
      <text x="690" y="329" fill="#fde68a" text-anchor="end">DUE</text>

      <rect x="440" y="350" width="280" height="34" rx="8" fill="#0e2233"/>
      <circle cx="460" cy="367" r="6" fill="#34d399"/><text x="476" y="371">Internal control attestation</text>
      <text x="690" y="371" fill="#6ee7b7" text-anchor="end">OK</text>
    </g>
  </g>
</svg>
